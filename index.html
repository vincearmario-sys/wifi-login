<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S2S WiFi Access</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }
    .container {
      max-width: 450px;
      margin: 50px auto;
      background: rgba(255,255,255,0.1);
      padding: 35px 25px;
      border-radius: 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    h1 { margin: 10px 0 5px; font-size: 28px; }
    p { margin: 10px 0; }
    input {
      padding: 15px;
      width: 85%;
      margin: 15px 0;
      border: none;
      border-radius: 10px;
      font-size: 17px;
    }
    button {
      padding: 15px 40px;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover { background: #218838; }
    #success { display: none; margin-top: 20px; }
    .wifi-info {
      background: rgba(255,255,255,0.2);
      padding: 15px;
      border-radius: 10px;
      margin: 15px 0;
      text-align: left;
    }
    .copy-btn {
      background: #007bff;
      padding: 8px 15px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔐 S2S Free WiFi</h1>
    <p>Enter password to connect</p>

    <input type="password" id="pass" placeholder="Enter WiFi Password" autofocus>
    <br><br>
    <button onclick="checkPassword()">Connect to WiFi</button>

    <div id="success">
      <h2>✅ Connected Successfully!</h2>
      
      <div class="wifi-info">
        <p><strong>Network 1 (Recommended):</strong> <span id="wifiName1">S2S_5GHz_7cXEZh</span></p>
        <p><strong>Password:</strong> <span id="wifiPass1">YourPasswordHere</span> 
           <button class="copy-btn" onclick="copyPassword('wifiPass1')">Copy</button></p>
      </div>

      <div class="wifi-info">
        <p><strong>Network 2:</strong> <span id="wifiName2">S2S_7cXEZh</span></p>
        <p><strong>Password:</strong> <span id="wifiPass2">YourPasswordHere</span> 
           <button class="copy-btn" onclick="copyPassword('wifiPass2')">Copy</button></p>
      </div>

      <p><small>You can now connect to the WiFi using the details above.</small></p>
    </div>
  </div>

  <script>
    const correctPassword = "S2S12345";   // ← CHANGE THIS TO YOUR REAL PASSWORD

    function checkPassword() {
      const userInput = document.getElementById("pass").value;
      
      if (userInput === correctPassword) {
        document.getElementById("success").style.display = "block";
      } else {
        alert("❌ Incorrect Password! Please try again.");
      }
    }

    function copyPassword(id) {
      const text = document.getElementById(id).textContent;
      navigator.clipboard.writeText(text).then(() => {
        alert("✅ Password copied to clipboard!");
      });
    }
  </script>
</body>
</html>
